[workspace]
resolver = "2"
members = [
    "crates/mellowmesh-core",
    "crates/mellowmesh-store",
    "crates/mellowmesh-client",
    "crates/mellowmesh-daemon",
    "crates/mellowmesh-cli",
    "crates/mellowmesh-bench",
    "crates/mellowmesh-connectors",
    "crates/mellowmesh-relay",
    "crates/mellowmesh-wasm",
    "crates/mellowmesh-app-core"
]

[workspace.package]
version = "0.1.1"
edition = "2021"
# Minimum supported Rust version (checked in CI). Raise it only together with
# the docs (README, installation, CONTRIBUTING).
rust-version = "1.89"
license = "MIT"
authors = ["Yannick Huchard"]
repository = "https://github.com/yannickhuchard/mellowmesh"
homepage = "https://github.com/yannickhuchard/mellowmesh"
readme = "README.md"
