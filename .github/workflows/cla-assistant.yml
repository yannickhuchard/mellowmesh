name: CLA Assistant

# Gates every pull request on a signed Contributor License Agreement, fully
# automated: a first-time contributor signs by posting the sign-off comment
# below, and the signature is recorded in the `cla-signatures` branch against
# their GitHub identity for all future PRs. No maintainer action required.
#
# Setup: no secrets needed — the default GITHUB_TOKEN is sufficient when
# signatures are stored in this same repository. Enable "Allow GitHub Actions
# to create and approve pull requests" is NOT required, but Actions must have
# write permission (Settings → Actions → General → Workflow permissions →
# Read and write).

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla-assistant:
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the MellowMesh CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: 'signatures/version1/cla.json'
          path-to-document: 'https://github.com/yannickhuchard/mellowmesh/blob/main/licensing/CLA.md'
          branch: 'cla-signatures'
          allowlist: 'yannickhuchard,dependabot[bot],*[bot]'
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the MellowMesh CLA'
          custom-allsigned-prcomment: 'All contributors have signed the MellowMesh CLA. Thank you!'
          custom-notsigned-prcomment: 'Thanks for your pull request! Before we can merge it, please read our [Contributor License Agreement](https://github.com/yannickhuchard/mellowmesh/blob/main/licensing/CLA.md) and sign it by posting the following comment on this PR:'
